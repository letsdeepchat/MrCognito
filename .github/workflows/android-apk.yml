name: Android APK

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/android-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Use the runner's preinstalled Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties
      - run: npm ci
      - name: Build the web bundle
        # Set the repository variable COGNITO_API_BASE (e.g. https://mrcognito.onrender.com) to bake a default server into the APK.
        env:
          VITE_API_BASE: ${{ vars.COGNITO_API_BASE || 'https://mrcognito.onrender.com' }}
        run: npm run build
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: frontend/android
        run: chmod +x gradlew && ./gradlew --no-daemon assembleDebug
      - name: Rename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ../MrCognito-debug.apk
      - uses: actions/upload-artifact@v5
        with:
          name: MrCognito-debug-apk
          path: MrCognito-debug.apk
      - name: Publish to the "android-latest" release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest MrCognito-debug.apk \
            --title "MrCognito Android (latest build)" \
            --notes "Debug-signed APK built from ${GITHUB_SHA::7}. Default server: ${{ vars.COGNITO_API_BASE || 'https://mrcognito.onrender.com' }} (change it under Settings, Server)." \
            --prerelease
